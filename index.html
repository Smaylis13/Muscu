<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme muscu</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1 id="mois"></h1>
    <div class="nav">
      <button class="ic" id="today">Aujourd’hui</button>
      <button class="ic" id="exp" hidden>Exporter</button>
      <button class="ic" id="prev" aria-label="Mois précédent">‹</button>
      <button class="ic" id="next" aria-label="Mois suivant">›</button>
    </div>
  </header>
  <div id="bn" hidden><span>Touche le jour où copier</span><button id="bn-x">Annuler</button></div>
  <div class="dow"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span></div>
  <div class="grid" id="grid"></div>
</main>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="sd">
  <div class="sheet" id="sheet"></div>
</div>

<script src="app.js"></script>
<script data-goatcounter="https://muscu83.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
